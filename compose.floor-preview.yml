# Standalone preview configuration: run ONLY with -f compose.floor-preview.yml
# Uses a separate container, host port and database directory from the live DCIM.
services:
  floor-planner-preview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrotech-dcim-floor-preview
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: dcim_floor_preview_session
    ports:
      # Loopback-only: reach from laptop with ssh -L 3001:127.0.0.1:3001\n      - "127.0.0.1:3001:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
